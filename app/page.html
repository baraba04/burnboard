function rowsFrom(answer, rowsKey, colsKey) {
  var cols = answer[colsKey];
  return answer[rowsKey].map(function (r) { var o = {}; for (var i = 0; i < cols.length; i++) o[cols[i]] = r[i]; return o; });
}
dash.loader('usage', { fn: function (a) { return rowsFrom(a.answer, 'facts', 'fact_cols'); } });
dash.loader('sessions', { fn: function (a) { return rowsFrom(a.answer, 'sessions', 'session_cols').map(function (r, i) { r.s = i; return r; }); } });

  return d.concat(h);
} });
dash.loader('limit_history', { fn: function (a) { return a.answer.limit_history ? rowsFrom(a.answer, 'limit_history', 'limit_history_cols') : []; } });
function optRows(a, rowsKey, colsKey) { return a.answer[rowsKey] ? rowsFrom(a.answer, rowsKey, colsKey) : []; }

dash.loader('compactions', { fn: function (a) { return optRows(a, 'compactions', 'compaction_cols'); } });
dash.loader('errors', { fn: function (a) { return optRows(a, 'errors', 'error_cols'); } });

dash.loader('sess_ctx', { fn: function (a) { return a.answer.sess_ctx || {}; } });

} });

    if (n >= 1e6) return f.format(',.1f')(n / 1e6) + u[1];

    d3.rollups(rows, function (rs) { return { n: d3.sum(rs, function (r) { return r.n; }), last: d3.max(rs, function (r) { return r.hour; }) }; }, function (r) { return r.kind; })
      .sort(function (a, b) { return b[1].n - a[1].n; }).forEach(function (x) {
        var i = x[0].indexOf(':'), tr = el('tr');
        tr.append(el('td', null, t(x[0].slice(0, i) === 'retry' ? 'err_retry' : 'err_final') + ': ' + x[0].slice(i + 1)), el('td', null, fmtInt(x[1].n)), el('td', null, fDT(x[1].last)));
        e.appendChild(tr);
      });
  });
  R('errspark', function (e, v) {
    e.replaceChildren();
    var rows = errRows(v), m = new Map(v.buckets.map(function (d) { return [v.bkey(d), 0]; }));
    rows.forEach(function (r) { var k = v.bkey(r.hour); if (m.has(k)) m.set(k, m.get(k) + r.n); });

      var n = m.get(v.bkey(d)), s = el('span');

      e.appendChild(s);
    });
  });

  // Weekday by hour of day (local time), for the selected period and filters.
  R('heat', function (e, v) {
    e.replaceChildren();
    var grid = d3.range(7).map(function () { return new Array(24).fill(0); });
    // Days brought back from the archive no longer know their hour of day, so they are left out here.
    v.rows.forEach(function (r) { if (v.b.restored.size && v.b.restored.has(dayKey(r.hour))) return; grid[(r.hour.getDay() + 6) % 7][r.hour.getHours()] += mval(r); });
    var max = d3.max(grid, function (g) { return d3.max(g); }) || 0;
    if (!max) { e.appendChild(el('div', 'u-smallnote', t('none_period'))); return; }
    var W = 1000, ml = 44, ch = 22, cw = (W - ml) / 24, H = 7 * ch + 20;
    var svg = d3.create('svg').attr('viewBox', '0 0 ' + W + ' ' + H).attr('role', 'img').attr('aria-label', t('h_heat'));
    var dayName = function (i) { return new Date(2024, 0, 1 + i).toLocaleDateString(APP.lang === 'sl' ? 'sl-SI' : 'en-GB', { weekday: 'short' }); };
    grid.forEach(function (g, di) {
      svg.append('text').attr('x', ml - 8).attr('y', di * ch + ch / 2).attr('dy', '0.32em').attr('text-anchor', 'end').text(dayName(di));

        if (val) rc.style('fill', dash.colors[0]).style('fill-opacity', 0.12 + 0.88 * val / max); else rc.style('fill', 'var(--cds-chart-grid)');

    d3.range(0, 24, 3).forEach(function (h) { svg.append('text').attr('x', ml + h * cw + cw / 2).attr('y', H - 5).attr('text-anchor', 'middle').text((h < 10 ? '0' : '') + h + ':00'); });
    e.appendChild(svg.node());
  });

  // Quota weeks: reset to reset, counted back from the current weekly reset time.
  R('qweeks', function (e, v) {
    e.replaceChildren();
    var l = v.b.limits.find(function (x) { return x.key === 'seven_day'; });
    if (!l || !l.resetsAt) { emptyRow(e, 4, 'qw_none'); return; }
    var reset = +new Date(l.resetsAt), WK = 7 * 864e5, rows = passing(v.b.rows), hist = dash.data('limit_history'), seen = new Map();
    if (hist.status === 'ok') hist.data.forEach(function (r) { if (r.key !== 'seven_day') return; var k = +new Date(r.resetsAt); seen.set(k, Math.max(seen.get(k) || 0, +r.pct)); });

    }

    weeks.forEach(function (w) {
      var tr = el('tr'), td = el('td'), box = el('div', 'u-model'), bar = el('i');
      bar.style.width = (100 * w.cost / max) + '%'; bar.style.background = w.k === 0 ? dash.colors[0] : 'var(--cds-chart-muted)';
      box.append(el('span', null, fDay(w.start) + ' – ' + fDay(w.end) + (w.k === 0 ? ' (' + t('qw_current') + ')' : '')), bar); td.appendChild(box);
      tr.append(td, el('td', null, fmtCost(w.cost)), el('td', null, fmtTok(w.tokens)),
        el('td', null, w.pct == null ? '—' : fmtPct0(w.pct) + ' ' + t(w.k === 0 ? 'qw_sofar' : 'qw_lastseen')));
      e.appendChild(tr);
    });
  });

  function exportCsv() {
    var v = view(); if (!v) return;
    var per = d3.timeFormat(v.hourly ? '%Y-%m-%d %H:00' : '%Y-%m-%d'), keys = ['model', 'project', 'agent', 'effort', 'via'], nums = ['input', 'output', 'cache_write', 'cache_read', 'tokens', 'cost', 'msgs'], agg = new Map();
    v.rows.forEach(function (r) {
      var id = [per(r.hour)].concat(keys.map(function (k) { return r[k]; })), key = id.join('\u0001'), a = agg.get(key);
      if (!a) { a = { id: id, n: nums.map(function () { return 0; }) }; agg.set(key, a); }
      nums.forEach(function (k, i) { a.n[i] += r[k]; });
    });
    // Text cells are quoted; a leading = + - @ is neutralised so a spreadsheet never runs it as a formula.
    var cell = function (x) { var c = String(x); if (/^[=+\-@\t\r]/.test(c)) c = "'" + c; return '"' + c.replace(/"/g, '""') + '"'; };
    var lines = [['period'].concat(keys, ['input', 'output', 'cache_write', 'cache_read', 'tokens', 'cost_usd', 'calls']).join(',')];
    Array.from(agg.values()).sort(function (a, b) { return a.id.join('\u0001') < b.id.join('\u0001') ? -1 : 1; }).forEach(function (a) {
      lines.push(a.id.map(cell).concat(a.n.map(function (x, i) { return nums[i] === 'cost' ? x.toFixed(4) : String(Math.round(x)); })).join(','));
    });
    var url = URL.createObjectURL(new Blob(['\ufeff' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' })), a = document.createElement('a');
    a.href = url; a.download = 'burnboard-' + state.range + '-' + dayKey(v.b.now) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }
  document.querySelectorAll('[data-export]').forEach(function (b) { b.addEventListener('click', exportCsv); });

  R('limits', function (e, v) {
    e.replaceChildren();
    v.b.limits.forEach(function (l) {
      var pct = +l.percentUsed, reset = new Date(l.resetsAt), left = reset - Date.now();
      var box = el('div'), top = el('div', 'u-lim-top'), meter = el('div', 'u-meter'), fill = el('span'), sub = el('div', 'u-lim-sub');
      top.append(el('span', null, t('lim_' + l.key)), el('b', null, fmtPct0(pct)));
      fill.style.width = Math.min(100, pct) + '%';
      fill.style.background = pct >= 90 ? 'var(--color-bad)' : pct >= 70 ? 'var(--color-warn)' : 'var(--color-ok)';
      meter.appendChild(fill);
      sub.appendChild(document.createTextNode(left > 0 ? t('lim_reset', { d: dur(left), at: fDT(reset) }) : t('lim_passed')));
      if (l.key === 'five_hour' && left > 0 && pct > 0) {
        var s5 = new Date(+reset - 5 * 36e5), f5 = (v.b.now - s5) / (5 * 36e5), h5 = +d3.utcHour.floor(s5);
        // Rows are whole hours: of the hour the window starts in, count only the part inside the window.
        var part5 = 1 - (+s5 - h5) / 36e5;
        var c5 = d3.sum(v.b.rows, function (r) { return +r.hour > h5 ? r.cost : +r.hour === h5 ? r.cost * part5 : 0; });
        sub.appendChild(el('br'));
        rich(sub, 'lim_5h', { cost: fmtCost(c5), per: fmtCost(c5 / pct) }, true);
        if (f5 > 0.05 && f5 < 1) {
          sub.appendChild(el('br'));
          var e5 = pct / f5;
          if (e5 >= 100) rich(sub, 'pace5_hit', { at: fDT(new Date(+s5 + (100 / e5) * 5 * 36e5)) }, true);
          else rich(sub, 'pace5_end', { pct: fmtPct0(e5) }, true);
        }
      }
      if (l.key === 'seven_day' && left > 0) {
        var ws = new Date(+reset - 7 * 864e5), frac = (v.b.now - ws) / (7 * 864e5);
        var wc = d3.sum(v.b.rows, function (r) { return r.hour >= ws ? r.cost : 0; });
        sub.appendChild(el('br'));
        if (pct > 0) rich(sub, 'lim_week', { cost: fmtCost(wc), per: fmtCost(wc / pct) }, true);
        else rich(sub, 'lim_week_only', { cost: fmtCost(wc) }, true);
        if (pct > 0 && frac > 0.02) {
          sub.appendChild(el('br'));
          var endPct = pct / frac;
          if (endPct >= 100) rich(sub, 'pace_hit', { at: fDT(new Date(+ws + (100 / endPct) * 7 * 864e5)) }, true);
          else rich(sub, 'pace_end', { pct: fmtPct0(endPct) }, true);
        }
        if (pct > 0 && pct < 100 && wc > 0) {

    if (!v.b.limits.length) e.textContent = t('lim_none');
  });

  // This week's limit: the measured percentage now, spread back over the week by this Mac's cost,
  // plus every reading taken at a refresh, an even-pace line and a straight projection to the reset.
  function weekData() {
    var b = base(); if (!b) return null;
    var l = b.limits.find(function (x) { return x.key === 'seven_day'; });
    if (!l || !l.resetsAt) return null;
    var reset = new Date(l.resetsAt), ws = new Date(+reset - 7 * 864e5), pct = +l.percentUsed;
    if (b.now >= reset) return null;
    var byHour = d3.rollup(b.rows.filter(function (r) { return r.hour >= ws; }), function (rs) { return d3.sum(rs, function (r) { return r.cost; }); }, function (r) { return +r.hour; });
    var hours = d3.utcHours(d3.utcHour.floor(ws), b.now), cum = 0, pts = [{ t: ws, c: 0 }];
    hours.forEach(function (h) { cum += byHour.get(+h) || 0; pts.push({ t: new Date(Math.min(+h + 36e5, +b.now)), c: cum }); });
    var est = cum > 0 ? pts.map(function (p) { return { t: p.t, p: pct * p.c / cum }; }) : [];
    var hist = dash.data('limit_history'), meas = [];
    if (hist.status === 'ok') meas = hist.data.filter(function (r) { return r.key === 'seven_day' && r.resetsAt === l.resetsAt; }).map(function (r) { return { t: new Date(r.t), p: +r.pct }; });
    var frac = (b.now - ws) / (7 * 864e5), endPct = frac > 0.02 && pct > 0 ? pct / frac : null;

  }
  dash.draw('weekchart', function (box) {
    var w = weekData();
    if (!w || (!w.est.length && !w.meas.length)) { box.textContent = base() ? t('wk_none') : '—'; return; }
    var W = Math.max(280, box.clientWidth), H = 190, mt = 10, mb = 24, mr = 12, ml = 40;
    var ymax = Math.max(100, Math.min(200, w.endPct || 0));
    var x = d3.scaleTime().domain([w.ws, w.reset]).range([ml, W - mr]), y = d3.scaleLinear().domain([0, ymax]).range([H - mb, mt]);
    var svg = d3.create('svg').attr('width', '100%').attr('height', H).attr('viewBox', '0 0 ' + W + ' ' + H).attr('role', 'img').attr('aria-label', t('h_week'));

      .style('stroke', function (d) { return d === 100 ? 'var(--color-bad)' : 'var(--cds-chart-grid)'; }).style('stroke-dasharray', function (d) { return d === 100 ? '2 3' : null; });
    svg.append('g').selectAll('text').data(yt).join('text').attr('x', ml - 8).attr('y', y).attr('dy', '0.32em').attr('text-anchor', 'end').text(function (d) { return fmtPct0(d); });
    var days = d3.timeDay.range(d3.timeDay.ceil(w.ws), w.reset);
    svg.append('g').selectAll('text').data(days).join('text').attr('x', function (d) { return x(d3.timeHour.offset(d, 12)); }).attr('y', H - 6).attr('text-anchor', 'middle')
      .text(function (d) { return d.toLocaleDateString(APP.lang === 'sl' ? 'sl-SI' : 'en-GB', { weekday: 'short' }); });
    svg.append('g').selectAll('line').data(days).join('line').attr('x1', x).attr('x2', x).attr('y1', mt).attr('y2', H - mb).style('stroke', 'var(--cds-chart-grid)');
    var line = d3.line().x(function (d) { return x(d.t); }).y(function (d) { return y(d.p); });
    svg.append('path').attr('d', line([{ t: w.ws, p: 0 }, { t: w.reset, p: 100 }])).style('fill', 'none').style('stroke', 'var(--cds-chart-muted)').style('stroke-width', 1.5).style('stroke-dasharray', '4 4');
    if (w.est.length) svg.append('path').attr('d', line(w.est)).style('fill', 'none').style('stroke', dash.colors[0]).style('stroke-width', 2);
    if (w.endPct) svg.append('path').attr('d', line([{ t: w.now, p: w.pct }, { t: w.reset, p: Math.min(w.endPct, ymax) }])).style('fill', 'none').style('stroke', dash.colors[0]).style('stroke-width', 1.5).style('stroke-dasharray', '2 4');
    svg.append('g').selectAll('circle').data(w.meas).join('circle').attr('cx', function (d) { return x(d.t); }).attr('cy', function (d) { return y(d.p); }).attr('r', 3.5).style('fill', 'var(--color-fg)');
    svg.append('text').attr('x', Math.min(x(w.now) + 8, W - mr - 30)).attr('y', y(w.pct) - 8).style('fill', 'var(--color-fg)').style('font-weight', 500).text(fmtPct0(w.pct));
    box.replaceChildren(svg.node());
  });
  R('weeklegend', function (e) {
    e.replaceChildren();
    [['wk_est', dash.colors[0], 'line'], ['wk_meas', 'var(--color-fg)', 'dot'], ['wk_pace', 'var(--cds-chart-muted)', 'line']].forEach(function (x) {
      var d = el('span'), i = el('i', x[2]); i.style.background = x[1];
      d.append(i, document.createTextNode(t(x[0]))); e.appendChild(d);
    });
  });

  function chartKeys(v) {
    var tot = d3.rollup(v.rows, function (rs) { return d3.sum(rs, mval); }, function (r) { return r.model; });
    var ranked = Array.from(tot.entries()).sort(function (a, b) { return b[1] - a[1]; }).map(function (x) { return x[0]; });
    var top = ranked.slice(0, 5);
    return { top: top, keys: ranked.length > 5 ? top.concat(['__other']) : top };
  }
  function keyName(k) { return k === '__other' ? t('other') : k; }
  function keyColor(k, v) { return k === '__other' ? 'var(--cds-chart-muted)' : v.b.colorOf[k]; }
  R('chartlegend', function (e, v) {
    e.replaceChildren();
    chartKeys(v).keys.forEach(function (k) {
      var d = el('span'), i = el('i'); i.style.background = keyColor(k, v);
      d.append(i, document.createTextNode(keyName(k))); e.appendChild(d);
    });
  });

  dash.draw('chart', function (box) {
    var v = view();
    if (!v) { box.textContent = '—'; return; }
    var W = Math.max(280, box.clientWidth), H = 260, mt = 10, mb = 26, mr = 8;
    var ck = chartKeys(v), keys = ck.keys, top = ck.top;
    var data = v.buckets.map(function (d) { var o = { d: d, k: v.bkey(d) }; keys.forEach(function (k) { o[k] = 0; }); return o; });
    var idx = new Map(data.map(function (o) { return [o.k, o]; }));
    v.rows.forEach(function (r) { var o = idx.get(v.bkey(r.hour)); if (!o) return; o[top.indexOf(r.model) >= 0 ? r.model : '__other'] += mval(r); });
    var series = d3.stack().keys(keys)(data);
    var ymax = d3.max(data, function (o) { return d3.sum(keys, function (k) { return o[k]; }); }) || 1;
    var y = d3.scaleLinear().domain([0, ymax]).nice(4).range([H - mb, mt]);
    var fLab = v.hourly ? fHour : fDay;
    var fTick = function (x) { return state.metric === 'cost' ? fmtCost0(x) : fmtTok(x); };
    var svg = d3.create('svg').attr('width', '100%').attr('height', H).attr('viewBox', '0 0 ' + W + ' ' + H).attr('role', 'img')
      .attr('aria-label', t('chart_title', { by: t(v.hourly ? 'by_hour' : 'by_day'), what: t(state.metric === 'cost' ? 'what_cost' : 'what_tokens') }));
    var ticks = y.ticks(4), tmp = svg.append('g');
    ticks.forEach(function (x) { tmp.append('text').text(fTick(x)); });
    box.replaceChildren(svg.node());
    var ml = 0;
    tmp.selectAll('text').each(function () { ml = Math.max(ml, this.getComputedTextLength()); });
    tmp.remove();
    ml = Math.ceil(ml) + 10;
    var x = d3.scaleBand().domain(data.map(function (o) { return o.k; })).range([ml, W - mr]).paddingInner(data.length > 40 ? 0.15 : 0.3).paddingOuter(0.05);
    svg.append('g').selectAll('line').data(ticks).join('line').attr('x1', ml).attr('x2', W - mr).attr('y1', y).attr('y2', y).style('stroke', 'var(--cds-chart-grid)');
    svg.append('g').selectAll('text').data(ticks).join('text').attr('x', ml - 8).attr('y', y).attr('dy', '0.32em').attr('text-anchor', 'end').text(fTick);
    series.forEach(function (s) {
      svg.append('g').style('fill', keyColor(s.key, v))
        .selectAll('rect').data(s).join('rect')
        .attr('x', function (d) { return x(d.data.k); }).attr('width', x.bandwidth())
        .attr('y', function (d) { return y(d[1]); }).attr('height', function (d) { return Math.max(0, y(d[0]) - y(d[1])); });
    });
    var step = Math.max(1, Math.ceil(data.length / Math.max(2, Math.floor((W - ml) / 56))));
    svg.append('g').selectAll('text').data(data.filter(function (d, i) { return (data.length - 1 - i) % step === 0; })).join('text')
      .attr('x', function (d) { return x(d.k) + x.bandwidth() / 2; }).attr('y', H - 8).attr('text-anchor', 'middle').text(function (d) { return fLab(d.d); });
    var tip = el('div', 'u-tip'); tip.hidden = true; box.appendChild(tip);
    svg.append('g').selectAll('rect').data(data).join('rect')
      .attr('x', function (d) { return x(d.k) - 1; }).attr('width', x.bandwidth() + 2).attr('y', mt).attr('height', H - mb - mt).style('fill', 'transparent')
      .on('pointerenter pointermove', function (ev, d) {
        tip.replaceChildren(el('b', null, (v.hourly ? fDay(d.d) + ' ' + fHour(d.d) : fDay(d.d)) + ' · ' + fmtVal(d3.sum(keys, function (k) { return d[k]; }))));
        keys.forEach(function (k) {
          if (!d[k]) return;
          var row = el('div'), i = el('i'); i.style.background = keyColor(k, v);
          row.append(i, document.createTextNode(keyName(k) + ': ' + fmtVal(d[k]))); tip.appendChild(row);
        });
        tip.hidden = false;
        var scale = box.clientWidth / W, cx = (x(d.k) + x.bandwidth() / 2) * scale, tw = tip.offsetWidth;
        tip.style.left = Math.max(0, Math.min(box.clientWidth - tw, cx - tw / 2)) + 'px';
        tip.style.top = '0px';
      })
      .on('pointerleave', function () { tip.hidden = true; });
  });

  function sync() {
    document.querySelectorAll('[data-range]').forEach(function (b) { var on = b.getAttribute('data-range') === state.range; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    document.querySelectorAll('[data-metric]').forEach(function (b) { var on = b.getAttribute('data-metric') === state.metric; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  }
  document.querySelectorAll('[data-range]').forEach(function (b) { b.addEventListener('click', function () { state.range = b.getAttribute('data-range'); sync(); redrawAll(); }); });
  document.querySelectorAll('[data-metric]').forEach(function (b) { b.addEventListener('click', function () { state.metric = b.getAttribute('data-metric'); sync(); redrawAll(); }); });
  sync();
})();
</script>
