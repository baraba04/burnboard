    var step = Math.max(1, Math.ceil(data.length / Math.max(2, Math.floor((W - ml) / 56))));
    svg.append('g').selectAll('text').data(data.filter(function (d, i) { return (data.length - 1 - i) % step === 0; })).join('text')
      .attr('x', function (d) { return x(d.k) + x.bandwidth() / 2; }).attr('y', H - 8).attr('text-anchor', 'middle').text(function (d) { return fLab(d.d); });
    var tip = el('div', 'u-tip'); tip.hidden = true; box.appendChild(tip);
    svg.append('g').selectAll('rect').data(data).join('rect')
      .attr('x', function (d) { return x(d.k) - 1; }).attr('width', x.bandwidth() + 2).attr('y', mt).attr('height', H - mb - mt).style('fill', 'transparent')
      .on('pointerenter pointermove', function (ev, d) {
        tip.replaceChildren(el('b', null, (v.hourly ? fDay(d.d) + ' ' + fHour(d.d) : fDay(d.d)) + ' · ' + fmtVal(d3.sum(keys, function (k) { return d[k]; }))));
        keys.forEach(function (k) {
          if (!d[k]) return;
          var row = el('div'); row.append(swatch(k, v), document.createTextNode(keyName(k) + ': ' + fmtVal(d[k]))); tip.appendChild(row);
        });
        tip.hidden = false;
        var scale = box.clientWidth / W, cx = (x(d.k) + x.bandwidth() / 2) * scale, tw = tip.offsetWidth;
        tip.style.left = Math.max(0, Math.min(box.clientWidth - tw, cx - tw / 2)) + 'px';
        tip.style.top = '0px';
      })
      .on('pointerleave', function () { tip.hidden = true; });
  });

  // --- tabs, controls -----------------------------------------------------------------------
  function readTab() {
    var h = location.hash.replace('#', '');
    if (TABS.indexOf(h) >= 0) return h;
    try { var s = localStorage.getItem('usage-claude-tab'); if (TABS.indexOf(s) >= 0) return s; } catch (e) {}
    return 'overview';
  }
  // Switching only shows and hides; the charts that need a size are redrawn for the new tab.
  function setTab(tab, focus) {
    state.tab = tab;
    document.querySelectorAll('[data-panel]').forEach(function (p) { p.hidden = p.getAttribute('data-panel') !== tab; });
    document.querySelectorAll('[data-tab]').forEach(function (b) {
      var on = b.getAttribute('data-tab') === tab;
      b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1;
      if (on && focus) b.focus();
    });
    try { localStorage.setItem('usage-claude-tab', tab); } catch (e) {}
    if (location.hash !== '#' + tab) { try { history.replaceState(null, '', '#' + tab); } catch (e) { location.hash = tab; } }
    drawSized();
  }
  function goTab(tab, anchor) {
    setTab(tab);
    window.scrollTo(0, 0);
    if (anchor) setTimeout(function () { var a = document.getElementById(anchor); if (a) a.scrollIntoView({ block: 'start' }); }, 0);
  }
  document.querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); window.scrollTo(0, 0); });
    b.addEventListener('keydown', function (ev) {
      var d = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      ev.preventDefault();
      setTab(TABS[(TABS.indexOf(state.tab) + d + TABS.length) % TABS.length], true);
    });
  });
  window.addEventListener('hashchange', function () { var h = location.hash.replace('#', ''); if (TABS.indexOf(h) >= 0 && h !== state.tab) setTab(h); });
  window.addEventListener('resize', function () { drawSized(); });

  // The "more" menu: a button that opens a small panel; it closes on a click outside, on Escape and when focus leaves it.
  var more = document.getElementById('u-more'), moreBtn = document.getElementById('u-more-btn'), menu = document.getElementById('u-menu');
  function setMenu(open, focus) {
    menu.hidden = !open; moreBtn.setAttribute('aria-expanded', String(open));
    if (!open && focus) moreBtn.focus();
  }
  moreBtn.addEventListener('click', function () { setMenu(menu.hidden); });
  menu.addEventListener('click', function (ev) { if (ev.target.closest('[data-export], #l-setup-btn')) setMenu(false); });
  document.addEventListener('click', function (ev) { if (!menu.hidden && !more.contains(ev.target)) setMenu(false); });
  more.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !menu.hidden) { ev.stopPropagation(); setMenu(false, true); } });
  more.addEventListener('focusout', function (ev) { if (!menu.hidden && ev.relatedTarget && !more.contains(ev.relatedTarget)) setMenu(false); });

  function sync() {
    document.querySelectorAll('[data-range]').forEach(function (b) { var on = b.getAttribute('data-range') === state.range; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    document.querySelectorAll('[data-metric]').forEach(function (b) { var on = b.getAttribute('data-metric') === state.metric; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
    document.querySelectorAll('[data-dim]').forEach(function (b) {
      var d = b.getAttribute('data-dim'), on = d === state.dim;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); b.classList.toggle('has-flt', state.filter[d] != null);
    });
  }
  document.querySelectorAll('[data-range]').forEach(function (b) { b.addEventListener('click', function () { state.range = b.getAttribute('data-range'); sync(); redrawAll(); }); });
  document.querySelectorAll('[data-metric]').forEach(function (b) { b.addEventListener('click', function () { state.metric = b.getAttribute('data-metric'); sync(); redrawAll(); }); });
  document.querySelectorAll('[data-dim]').forEach(function (b) { b.addEventListener('click', function () { state.dim = b.getAttribute('data-dim'); sync(); redrawAll(); }); });
  sync();
  setTab(readTab());
})();
</script>
