body { margin: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: 14px; }
.l-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto 24px; padding: 12px 0; background: var(--color-bg); border-bottom: 1px solid var(--color-border-line); }
.l-btn { font: inherit; font-weight: 500; color: var(--color-bg); background: var(--color-fg); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
.l-btn:disabled { opacity: .5; cursor: progress; }
.l-btn:focus-visible { outline: 2px solid var(--c2); outline-offset: 2px; }
.l-status { color: var(--color-fg-muted); font-size: 13px; flex: 1 1 200px; min-width: 0; }
.l-status.bad { color: var(--color-bad); }
.l-lang { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--color-border-line); border-radius: 8px; background: var(--color-panel); margin-left: auto; }
.l-lang button { font: inherit; font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--color-fg-muted); background: transparent; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.l-lang button.on { background: var(--color-bg); color: var(--color-fg); box-shadow: 0 0 0 1px var(--color-border-line); }
.l-lang button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 1px; }
.l-notes { max-width: 1100px; margin: 0 auto 16px; color: var(--color-warn); font-size: 13px; }
.l-setup { display: none; max-width: 720px; margin: 0 auto; line-height: 1.5; }
.l-setup h2 { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-title); font-weight: 500; margin: 0 0 8px; }
.l-setup h3 { font-size: var(--cds-font-size-heading); font-weight: 500; margin: 24px 0 8px; }
.l-setup p, .l-setup ul { margin: 0 0 8px; }
.l-setup ul { padding-left: 20px; }
.l-setup li { margin-bottom: 8px; }
.l-setup li.ok::marker { color: var(--color-ok); }
.l-setup li.bad { color: var(--color-warn); }
.l-setup li.bad::marker { color: var(--color-warn); }
.l-setup .l-muted { color: var(--color-fg-muted); }
.l-setup .l-err { color: var(--color-bad); }
.l-setup li .l-btn { margin-top: 6px; }
.l-setup select { font: inherit; max-width: 100%; padding: 6px 8px; color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 8px; }
.l-setup label { display: flex; align-items: flex-start; gap: 8px; }
.l-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.l-btn.l-alt { color: var(--color-fg); background: transparent; border: 1px solid var(--color-border-line); }
.l-welcome { max-width: 520px; margin: 8vh auto 0; text-align: center; }
.l-welcome h2 { margin-bottom: 12px; }
.l-welcome ul { list-style: none; padding: 0; margin: 20px 0; }
.l-welcome label { justify-content: center; text-align: left; margin: 20px 0; }
.l-welcome .l-row { justify-content: center; flex-direction: column; align-items: center; gap: 12px; }
.l-welcome .l-big { font-size: 1.15em; padding: 14px 34px; }
.setup-on .l-setup { display: block; }
.setup-on #dash-root, .setup-on #l-notes, .setup-on .l-foot, .setup-on #l-refresh, .setup-on #l-status, .setup-on #l-setup-btn { display: none; }
.l-foot { max-width: 1100px; margin: 32px auto 0; color: var(--color-fg-muted); font-size: 12px; line-height: 1.5; }

var APP = {

  // Without vars the raw template is returned (placeholders kept).
  t: function (key, vars) {

  }

// Minimal local stand-in for the `dash` object the page is written against.
var RAW = null, loaders = {}, draws = {}, cache = {}, statusNow = { key: 'st_loading' };
var dash = {

  loader: function (id, o) { loaders[id] = o.fn; },
  data: function (id) {

    return { status: 'ok', data: cache[id] };
  },
  draw: function (name, fn) {
    if (fn) { draws[name] = fn; return; }

  onData: function (fn) { fn(); },

function drawAll() { Object.keys(draws).forEach(function (n) { try { dash.draw(n); } catch (e) { console.error(n, e); } }); }
function applyStatic() {
  document.documentElement.lang = APP.lang;
  document.querySelectorAll('[data-i18n]').forEach(function (e) { e.textContent = APP.t(e.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-aria]').forEach(function (e) { e.setAttribute('aria-label', APP.t(e.getAttribute('data-i18n-aria'))); });
  document.querySelectorAll('[data-lang]').forEach(function (b) { var on = b.getAttribute('data-lang') === APP.lang; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });

function setStatus(key, vars, bad) { statusNow = { key: key, vars: vars, bad: bad }; renderStatus(); }
function renderStatus() { var s = document.getElementById('l-status'); if (!s) return; s.textContent = APP.t(statusNow.key, statusNow.vars || {}); s.classList.toggle('bad', !!statusNow.bad); }
function renderNotes() {
  var box = document.getElementById('l-notes'); if (!box) return;
  var notes = RAW ? (RAW.meta[0].notes || []) : [];
  box.textContent = notes.map(function (n) {
    if (typeof n === 'string') return n;
    return APP.t('note_' + n.code, { why: n.why ? APP.t('why_' + n.why) : '', detail: n.detail || '' });
  }).join(' ');

}
function show(json) { RAW = json; cache = {}; renderNotes(); drawAll(); }
function setLang(l) {
  APP.lang = l === 'sl' ? 'sl' : 'en';
  try { localStorage.setItem('usage-claude-lang', APP.lang); } catch (e) {}
  applyStatic(); drawAll();
}
function loadFresh() {
  var btn = document.getElementById('l-refresh'), t0 = Date.now();
  btn.disabled = true; setStatus('st_reading', { s: 0 });
  var tick = setInterval(function () { setStatus('st_reading', { s: Math.round((Date.now() - t0) / 1000) }); }, 1000);
  fetch('/data.json', { headers: { 'X-Usage-Claude': '1' } }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); })
    .then(function (j) {
      clearInterval(tick); show(j);
      setStatus('st_done', { time: new Date().toLocaleTimeString(APP.lang === 'sl' ? 'sl-SI' : 'en-GB', { hour: '2-digit', minute: '2-digit' }), s: Math.round((Date.now() - t0) / 1000) });
    })
    .catch(function (e) {
      clearInterval(tick);
      if (BRIDGE && e.message === 'setup_needed') return openSetup();  // consent missing or out of date
      setStatus('st_fail', { msg: e.message }, true);

}
// First-run and setup screen. It exists only inside the app: the bridge is the native side that
// stores consent and profiles. Under the development server there is no bridge and none of this shows.
var BRIDGE = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.usage) || null;
var HDR = { 'X-Usage-Claude': '1' };
var SETUP = { st: null, limits: true, err: null, sign: null, more: false };
function getStatus() { return fetch('/status.json', { headers: HDR }).then(function (r) { return r.json(); }); }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function showSetup(st) {
  SETUP.st = st; SETUP.err = null; SETUP.sign = null;
  SETUP.more = !!(st.consent && st.consent.given);  // first run: the short welcome; reopened from the Setup button: everything
  SETUP.limits = st.consent && typeof st.consent.limits_call === 'boolean' ? st.consent.limits_call : true;

// A fixed native action that needs no answer from the page (open a site, Terminal, Apple's installer).
function fire(cmd) {
  BRIDGE.postMessage({ cmd: cmd }).then(function (s) {
    SETUP.err = JSON.parse(s).error || null; renderSetup();
  }).catch(function () { SETUP.err = 'bridge'; renderSetup(); });
}
// Claude Code signs in by itself (its own browser flow); the bridge answers when it has ended.
// SETUP.sign is the text key shown under the button: while pending the button is disabled.
function signIn() {
  SETUP.sign = 'sign_in_wait'; renderSetup();

    var r = JSON.parse(s);

    if (r.error) { SETUP.sign = r.error === 'no_claude' ? 'err_no_claude' : 'err_sign_in_failed'; renderSetup(); }

    else { SETUP.sign = null; getStatus().then(function (st) { SETUP.st = st; renderSetup(); }).catch(function () { SETUP.err = 'bridge'; renderSetup(); }); }

function agree() {

    var r = JSON.parse(s);

  }).catch(function () { SETUP.err = 'bridge'; renderSetup(); });

function renderSetup() {
