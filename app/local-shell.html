<title>Burnboard</title>
<style>
:root {
  --color-fg: #1f1e1d; --color-fg-muted: #6b6a68; --color-bg: #faf9f5; --color-panel: #f0eee6; --color-border-line: #dddbd2;
  --color-ok: #2e7d32; --color-warn: #b26a00; --color-bad: #c62828;
  --font-anthropic-sans: system-ui, -apple-system, "Helvetica Neue", sans-serif; --font-anthropic-serif: Georgia, "Times New Roman", serif;
  --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 24px; --cds-font-weight-medium: 500;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 20px; --cds-gap-xl: 32px; --cds-pad-lg: 20px; --cds-radius: 8px;
  --cds-chart-muted: #b8b6ad; --cds-chart-grid: #e6e4dc; --cds-text-secondary: #6b6a68;
  --cds-surface-popover: #ffffff; --cds-border: #dddbd2; --cds-shadow-popover: 0 2px 8px rgba(0,0,0,.15);
  --c1: #d97757; --c2: #6a9bcc; --c3: #788c5d; --c4: #c9a227; --c5: #8e6bbf; --c6: #4aa3a3;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --color-fg: #ecebe6; --color-fg-muted: #a3a19a; --color-bg: #1c1b19; --color-panel: #262523; --color-border-line: #3a3936;
    --color-ok: #6cbf70; --color-warn: #e0a84a; --color-bad: #ef6b6b;
    --cds-chart-muted: #5c5a55; --cds-chart-grid: #302f2c; --cds-text-secondary: #a3a19a;
    --cds-surface-popover: #2c2b28; --cds-border: #45433f; --cds-shadow-popover: 0 2px 10px rgba(0,0,0,.5);
    --c1: #e08a6c; --c2: #82afdc; --c3: #94a878; --c4: #d9b84a; --c5: #a68bd1; --c6: #62b8b8;
  }
}
body { margin: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: 14px; }
.l-bar { display: none; position: sticky; top: 0; z-index: 5; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 1100px; margin: 0 auto 24px; padding: 12px 0; background: var(--color-bg); border-bottom: 1px solid var(--color-border-line); }
.setup-on .l-bar { display: flex; }
.l-btn { font: inherit; font-weight: 500; color: var(--color-bg); background: var(--color-fg); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
.l-btn:disabled { opacity: .5; cursor: progress; }
.l-btn:focus-visible { outline: 2px solid var(--c2); outline-offset: 2px; }
.l-lang { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--color-border-line); border-radius: 8px; background: var(--color-panel); margin-left: auto; }
.l-lang button { font: inherit; font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--color-fg-muted); background: transparent; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.l-lang button.on { background: var(--color-bg); color: var(--color-fg); box-shadow: 0 0 0 1px var(--color-border-line); }
.l-lang button:focus-visible { outline: 2px solid var(--color-fg); outline-offset: 1px; }
.l-setup { display: none; max-width: 720px; margin: 0 auto; line-height: 1.5; }
.l-setup h2 { font-family: var(--font-anthropic-serif); font-size: var(--cds-font-size-title); font-weight: 500; margin: 0 0 8px; }
.l-setup h3 { font-size: var(--cds-font-size-heading); font-weight: 500; margin: 24px 0 8px; }
.l-setup p, .l-setup ul { margin: 0 0 8px; }
.l-setup ul { padding-left: 20px; }
.l-setup li { margin-bottom: 8px; }
.l-setup li.ok::marker { color: var(--color-ok); }
.l-setup li.bad { color: var(--color-warn); }
.l-setup li.bad::marker { color: var(--color-warn); }
.l-setup .l-muted { color: var(--color-fg-muted); }
.l-setup .l-err { color: var(--color-bad); }
.l-setup li .l-btn { margin-top: 6px; }
.l-setup select { font: inherit; max-width: 100%; padding: 6px 8px; color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: 8px; }
.l-setup label { display: flex; align-items: flex-start; gap: 8px; }
.l-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.l-btn.l-alt { color: var(--color-fg); background: transparent; border: 1px solid var(--color-border-line); }
.l-welcome { max-width: 520px; margin: 8vh auto 0; text-align: center; }
.l-welcome h2 { margin-bottom: 12px; }
.l-welcome ul { list-style: none; padding: 0; margin: 20px 0; }
.l-welcome label { justify-content: center; text-align: left; margin: 20px 0; }
.l-welcome .l-row { justify-content: center; flex-direction: column; align-items: center; gap: 12px; }
.l-welcome .l-big { font-size: 1.15em; padding: 14px 34px; }
.setup-on .l-setup { display: block; }
.setup-on #dash-root { display: none; }
</style>

  }
  row = el('div', 'l-row');
  row.appendChild(button('btn_agree', false, agree));
  box.appendChild(row);
}

function startDash() {
  fetch('/last.json', { headers: HDR }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (j) {
      if (!j.meta) return;        // {} means no snapshot yet
      delete j.meta[0].update;    // an update notice comes only from a refresh by the running version
      show(j);
    })
    .catch(function () {})
    .then(loadFresh);             // every open ends in a refresh; the last snapshot only fills the wait
}
window.addEventListener('DOMContentLoaded', function () {
  applyStatic();
  document.getElementById('l-refresh').addEventListener('click', loadFresh);
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); }); });
  if (!BRIDGE) return startDash();
  var sb = document.getElementById('l-setup-btn');
  sb.hidden = false; sb.addEventListener('click', openSetup);
  getStatus().then(function (st) {
    var ver = document.getElementById('l-version');
    if (st.version && ver) { ver.textContent = 'Burnboard ' + st.version; ver.hidden = false; }
    if (st.needs_setup) showSetup(st); else startDash();
  }).catch(startDash);
});
</script>
</head>
<body>
<div class="l-bar">
  <div class="l-lang" role="group" data-i18n-aria="aria_lang">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="sl">SL</button>
  </div>
</div>
<div class="l-setup" id="l-setup"></div>
<div id="dash-root">
<!--PAGE-->
</div>
</body>
</html>
